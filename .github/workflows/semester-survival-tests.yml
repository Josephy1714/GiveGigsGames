name: Semester Survival runtime tests
on:
  push:
    branches: [main]
    paths:
      - 'games/semester-survival/**'
      - '.github/workflows/semester-survival-tests.yml'
  pull_request:
    paths:
      - 'games/semester-survival/**'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          find games/semester-survival -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run runtime tests
        run: node --test games/semester-survival/tests/adventure-config-smoke.test.cjs
