name: Build Jay runner runtime atlas
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'games/semester-survival-runner/assets/source/characters/jay/**'
      - 'games/semester-survival-runner/assets/characters/**'
      - 'games/semester-survival-runner/src/tools/build-jay-atlas.py'
permissions:
  contents: write
concurrency:
  group: jay-runner-atlas-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - run: python games/semester-survival-runner/src/tools/build-jay-atlas.py
      - name: Publish generated runtime atlas
        run: |
          mkdir -p games/semester-survival-runner/assets/processed/jay-runtime
          cp games/semester-survival-runner/assets/processed/jay-staging/jay-atlas-staging.png games/semester-survival-runner/assets/processed/jay-runtime/jay-atlas.png
          cp games/semester-survival-runner/assets/processed/jay-staging/jay-atlas-staging.json games/semester-survival-runner/assets/processed/jay-runtime/jay-atlas.json
          python - <<'PY'
          import json
          p='games/semester-survival-runner/assets/processed/jay-runtime/jay-atlas.json'
          d=json.load(open(p))
          d['status']='runtime-candidate'
          d['atlas']='jay-atlas.png'
          for clip in d['clips'].values(): clip.pop('reviewStatus', None)
          d.pop('warning', None)
          json.dump(d,open(p,'w'),separators=(',',':'))
          PY
      - name: Refresh catalog and commit generated assets
        run: |
          rm -rf games/semester-survival-runner/assets/processed/jay-staging
          node scripts/build-browser-catalog.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+users.noreply.github.com
          git add games/semester-survival-runner/assets/processed/jay-runtime games/catalog-data.js
          git diff --cached --quiet || git commit -m "Build Jay runner runtime atlas"
          git push
