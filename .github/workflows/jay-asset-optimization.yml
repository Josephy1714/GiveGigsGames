name: Jay asset compression validation

on:
  push:
    branches: [jay-asset-optimization]
    paths:
      - 'games/semester-survival-runner-3d/assets/3d/jay/jay-unified.glb'
      - 'games/semester-survival-runner-3d/src/three/jay-character.js'
      - '.github/workflows/jay-asset-optimization.yml'
  pull_request:
    paths:
      - 'games/semester-survival-runner-3d/assets/3d/jay/jay-unified.glb'
      - 'games/semester-survival-runner-3d/src/three/jay-character.js'
      - '.github/workflows/jay-asset-optimization.yml'

permissions:
  contents: write

jobs:
  optimize-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install glTF optimizer
        run: npm install --no-save --no-package-lock @gltf-transform/cli@4.2.1
      - name: Compress Jay geometry and animation buffers with Meshopt
        run: |
          INPUT=games/semester-survival-runner-3d/assets/3d/jay/jay-unified.glb
          TEXTURED=/tmp/jay-unified-webp.glb
          OUTPUT=/tmp/jay-unified-webp-meshopt.glb
          BEFORE=$(wc -c < "$INPUT")
          npx --no-install gltf-transform textureCompress "$INPUT" "$TEXTURED" --targetFormat webp --quality 95
          npx --no-install gltf-transform meshopt "$TEXTURED" "$OUTPUT" --level medium
          AFTER=$(wc -c < "$OUTPUT")
          echo "Jay GLB before: $BEFORE bytes"
          echo "Jay GLB after WebP + Meshopt: $AFTER bytes"
          if [ "$AFTER" -ge "$BEFORE" ]; then
            echo "Combined compression did not reduce the asset; retaining the original GLB."
          else
            cp "$OUTPUT" "$INPUT"
          fi
      - name: Validate GLB structure, all six clips, skin and compression extension
        run: |
          python3 - <<'PY'
          import json, struct
          from pathlib import Path
          p = Path("games/semester-survival-runner-3d/assets/3d/jay/jay-unified.glb")
          data = p.read_bytes()
          magic, version, length = struct.unpack_from("<4sII", data, 0)
          chunk_length, chunk_type = struct.unpack_from("<I4s", data, 12)
          if magic != b"glTF" or version != 2 or length != len(data) or chunk_type != b"JSON":
              raise SystemExit("Invalid GLB 2.0 container.")
          doc = json.loads(data[20:20 + chunk_length].decode("utf-8").rstrip(" "))
          expected = {"Idle", "Run", "Run_InPlace", "Jump", "Slide", "Fall"}
          names = {a.get("name") for a in doc.get("animations", [])}
          if names != expected or len(doc.get("animations", [])) != 6:
              raise SystemExit(f"Animation clips changed: {sorted(names)}")
          if not doc.get("skins") or not doc.get("meshes"):
              raise SystemExit("Skinned mesh or geometry missing.")
          extensions = set(doc.get("extensionsUsed", []))
          if "EXT_meshopt_compression" not in extensions:
              raise SystemExit("Meshopt compression extension is missing.")
          if doc.get("images") and "EXT_texture_webp" not in extensions:
              raise SystemExit("WebP texture compression extension is missing.")
          if not doc.get("materials"):
              raise SystemExit("Materials missing.")
          print(f"Validated {p.stat().st_size:,} byte GLB; clips={sorted(names)}; meshes={len(doc['meshes'])}; skins={len(doc['skins'])}; materials={len(doc['materials'])}")
          PY
      - name: Install browser test dependencies
        run: |
          npm install --prefix games/semester-survival-runner-3d/.ci-test three@0.180.0
          npm install --prefix /tmp/jay-browser playwright@1.56.1
          /tmp/jay-browser/node_modules/.bin/playwright install chromium
      - name: Serve the gameplay fixture
        run: |
          python3 -m http.server 4174 --bind 127.0.0.1 > /tmp/jay-gameplay-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4174/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/jay-gameplay-server.log
          exit 1
      - name: Load compressed Jay and test 101 run cycles and animation transitions
        env:
          PLAYWRIGHT_MODULE: /tmp/jay-browser/node_modules/playwright/index.mjs
        run: node games/semester-survival-runner-3d/tests/jay-gameplay-integration.mjs
      - name: Remove temporary browser-test dependencies from the game folder
        run: rm -rf games/semester-survival-runner-3d/.ci-test
      - name: Rebuild catalog and verify game package limits
        run: |
          node scripts/build-browser-catalog.mjs
          npm run check:size
          npm run check:offline
      - name: Commit optimized asset and generated package metadata
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/semester-survival-runner-3d/assets/3d/jay/jay-unified.glb games/catalog-data.js
          if git diff --cached --quiet; then
            echo "Optimized asset and package metadata are already current."
          else
            git commit -m "Compress Jay runtime GLB with Meshopt"
            git push origin HEAD:jay-asset-optimization
          fi
