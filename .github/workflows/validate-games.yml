name: Validate browser games

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check generated offline catalog
        run: node scripts/build-browser-catalog.mjs --check
      - name: Enforce per-game 10 MB limit
        run: node scripts/check-game-sizes.mjs
      - name: Check downloaded-folder entrypoints
        run: node scripts/check-offline-entrypoints.mjs
      - name: Check local game assets
        run: node scripts/check-game-assets.mjs
      - name: Install Chromium for arcade smoke checks
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check catalog, player, and return navigation
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --fail --silent --retry 5 --retry-connrefused http://127.0.0.1:4173/index.html >/dev/null
          node scripts/smoke-arcade.mjs
      - name: Package the validated arcade
        run: git archive --format=zip --output=GiveGigsGames.zip HEAD
      - name: Retain the playable build
        uses: actions/upload-artifact@v4
        with:
          name: arcade-${{ github.sha }}
          path: GiveGigsGames.zip
          retention-days: 30
