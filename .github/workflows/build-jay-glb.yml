name: Build Jay animated GLB

on:
  push:
    branches:
      - semester-survival-3d-complete-edition
    paths:
      - ".github/workflows/build-jay-glb.yml"
      - "games/semester-survival-runner-3d/tools/build-jay-glb.py"
      - "games/semester-survival-runner-3d/assets/Aj.fbx"
      - "games/semester-survival-runner-3d/assets/Running.fbx"
      - "games/semester-survival-runner-3d/assets/Breathing Idle.fbx"
      - "games/semester-survival-runner-3d/assets/Running Jump.fbx"
      - "games/semester-survival-runner-3d/assets/Running Slide.fbx"
      - "games/semester-survival-runner-3d/assets/Shoulder Hit And Fall.fbx"

permissions:
  contents: write

jobs:
  build-character:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout 3D branch
        uses: actions/checkout@v4
        with:
          ref: semester-survival-3d-complete-edition
          fetch-depth: 0

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender

      - name: Merge Mixamo clips onto Ajay rig and export GLB
        run: |
          blender --background --python games/semester-survival-runner-3d/tools/build-jay-glb.py

      - name: Validate GLB output
        run: |
          test -s games/semester-survival-runner-3d/assets/3d/jay/jay.glb
          file games/semester-survival-runner-3d/assets/3d/jay/jay.glb
          ls -lh games/semester-survival-runner-3d/assets/3d/jay/jay.glb

      - name: Commit generated character asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/semester-survival-runner-3d/assets/3d/jay/jay.glb
          if git diff --cached --quiet; then
            echo "GLB is unchanged; nothing to commit."
          else
            git commit -m "Build unified animated Jay GLB character"
            git push origin HEAD:semester-survival-3d-complete-edition
          fi
