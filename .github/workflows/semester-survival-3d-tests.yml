name: Semester Survival 3D conversion checks

on:
  push:
    branches: [semester-survival-3d-complete-edition]
    paths:
      - 'games/semester-survival-runner-3d/**'
      - '.github/workflows/semester-survival-3d-tests.yml'
  pull_request:
    paths:
      - 'games/semester-survival-runner-3d/**'
      - '.github/workflows/semester-survival-3d-tests.yml'

permissions:
  contents: write

jobs:
  three-d-runner:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          find games/semester-survival-runner-3d -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' \) -print0 | xargs -0 -n1 node --check
      - name: Run focused runner and animation tests
        working-directory: games/semester-survival-runner-3d
        run: npm run test:runner-modules

  build-jay-character:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
          # Install NumPy into Blender's bundled Python (required by FBX importer).
          blender --background --python-expr "import ensurepip; ensurepip.bootstrap()"
          BLENDER_PYTHON=$(blender --background --python-expr "import sys; print(sys.executable)" 2>/dev/null | tail -n 1)
          "$BLENDER_PYTHON" -m pip install --upgrade pip numpy
          # Ubuntu's Blender 3.0 ships a reduced OCIO config without the
          # newer Non-Color label used by Mixamo FBX materials.
          sudo grep -RIl 'Non-Color' /usr/share/blender/scripts | xargs -r sudo sed -i 's/Non-Color/Linear/g'
      - name: Merge Ajay rig and all supplied Mixamo clips
        run: |
          blender --background --python games/semester-survival-runner-3d/tools/build-jay-glb.py
      - name: Validate exported GLB
        run: |
          test -s games/semester-survival-runner-3d/assets/3d/jay/jay.glb
          file games/semester-survival-runner-3d/assets/3d/jay/jay.glb
          ls -lh games/semester-survival-runner-3d/assets/3d/jay/jay.glb
      - name: Commit generated character
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/semester-survival-runner-3d/assets/3d/jay/jay.glb
          if git diff --cached --quiet; then
            echo "GLB unchanged."
          else
            git commit -m "Build unified animated Jay GLB character [skip ci]"
            git push origin HEAD:semester-survival-3d-complete-edition
          fi
