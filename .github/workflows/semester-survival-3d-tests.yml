name: Semester Survival 3D conversion checks

on:
  push:
    branches: [semester-survival-3d-complete-edition]
    paths:
      - 'games/semester-survival-runner-3d/**'
      - '.github/workflows/semester-survival-3d-tests.yml'
  pull_request:
    paths:
      - 'games/semester-survival-runner-3d/**'
      - '.github/workflows/semester-survival-3d-tests.yml'

concurrency:
  group: semester-survival-3d-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  three-d-runner:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          find games/semester-survival-runner-3d -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' \) -print0 | xargs -0 -n1 node --check
      - name: Run focused runner and animation tests
        working-directory: games/semester-survival-runner-3d
        run: npm run test:runner-modules

  build-jay-character:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-pil
          # Bootstrap pip explicitly: Debian/Ubuntu disables ensurepip.
          BLENDER_PYTHON=$(blender --background --python-expr "import sys; print(sys.executable)" 2>/dev/null | grep "^/" | tail -n 1)
          test -x "$BLENDER_PYTHON"
          curl -fsSL https://bootstrap.pypa.io/get-pip.py -o /tmp/get-pip.py
          "$BLENDER_PYTHON" /tmp/get-pip.py
          "$BLENDER_PYTHON" -m pip install --no-cache-dir numpy
      - name: Merge Ajay rig and all supplied Mixamo clips
        run: |
          blender --background --python games/semester-survival-runner-3d/tools/build-jay-glb.py
      - name: Build compact Jay UI portrait
        run: python3 games/semester-survival-runner-3d/tools/build-jay-portrait.py
      - name: Validate exported GLB
        run: |
          test -s games/semester-survival-runner-3d/assets/3d/jay/jay.glb
          file games/semester-survival-runner-3d/assets/3d/jay/jay.glb
          ls -lh games/semester-survival-runner-3d/assets/3d/jay/jay.glb
      - name: Commit generated character
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/semester-survival-runner-3d/assets/3d/jay/jay.glb games/semester-survival-runner-3d/assets/3d/jay/jay-portrait.webp
          if git diff --cached --quiet; then
            echo "GLB unchanged."
          else
            git commit -m "Build unified animated Jay GLB character [skip ci]"
            git fetch origin semester-survival-3d-complete-edition
            git rebase origin/semester-survival-3d-complete-edition
            git push origin HEAD:semester-survival-3d-complete-edition
          fi
