name: Semester Survival 3D conversion checks

on:
  push:
    branches: [semester-survival-3d-complete-edition]
    paths:
      - 'games/semester-survival-runner-3d/**'
      - '.github/workflows/semester-survival-3d-tests.yml'
  pull_request:
    paths:
      - 'games/semester-survival-runner-3d/**'
      - '.github/workflows/semester-survival-3d-tests.yml'

concurrency:
  group: semester-survival-3d-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  three-d-runner:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          find games/semester-survival-runner-3d -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' \) -print0 | xargs -0 -n1 node --check
      - name: Run focused runner and animation tests
        working-directory: games/semester-survival-runner-3d
        run: npm run test:runner-modules
      - name: Install Chromium for real-browser smoke test
        working-directory: games/semester-survival-runner-3d
        run: |
          npm install --prefix /tmp/semester-survival-browser playwright@1.56.1
          /tmp/semester-survival-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Start local game server
        working-directory: games/semester-survival-runner-3d
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/semester-survival-server.log 2>&1 &
          echo $! > /tmp/semester-survival-server.pid
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/semester-survival-server.log
          exit 1
      - name: Verify the live 3D game, model, animations and graphics settings in Chromium
        working-directory: games/semester-survival-runner-3d
        env:
          PLAYWRIGHT_MODULE: /tmp/semester-survival-browser/node_modules/playwright/index.mjs
        run: node --test tests/three-browser-smoke.mjs
      - name: Verify the 10 MB package budget and final Jay GLB
        run: |
          python3 - <<'PY'
          import json, struct
          from pathlib import Path
          root = Path("games/semester-survival-runner-3d")
          files = [p for p in root.rglob("*") if p.is_file()]
          total = sum(p.stat().st_size for p in files)
          print(f"3D package: {len(files)} files, {total:,} bytes ({total / 1_000_000:.3f} MB)")
          if total > 10_000_000:
              raise SystemExit("3D package exceeds the strict 10 MB budget.")
          if any(p.suffix.lower() == ".fbx" for p in files):
              raise SystemExit("Merged FBX source files must not remain in the runtime package.")
          glb = root / "assets/3d/jay/jay-unified.glb"
          portrait = root / "assets/3d/jay/jay-portrait.webp"
          if not glb.is_file() or not portrait.is_file():
              raise SystemExit("Final Jay GLB or UI portrait is missing.")
          data = glb.read_bytes()
          magic, version, length = struct.unpack_from("<4sII", data, 0)
          chunk_length, chunk_type = struct.unpack_from("<I4s", data, 12)
          if magic != b"glTF" or version != 2 or length != len(data) or chunk_type != b"JSON":
              raise SystemExit("Jay asset is not a valid GLB 2.0 file.")
          doc = json.loads(data[20:20 + chunk_length].decode("utf-8").rstrip(" "))
          names = {a.get("name") for a in doc.get("animations", [])}
          expected = {"Idle", "Run", "Run_InPlace", "Jump", "Slide", "Fall"}
          if names != expected or len(doc.get("animations", [])) != 6:
              raise SystemExit(f"Expected the six unified Jay animations; found {sorted(names)}.")
          if not doc.get("skins") or not doc.get("meshes"):
              raise SystemExit("Jay GLB must contain a skinned mesh.")
          original = Path("games/semester-survival-runner/assets/processed/jay-runtime/jay-atlas.png")
          if not original.is_file():
              raise SystemExit("The original 2D game's character assets were not preserved.")
          print("Jay GLB verified:", sorted(names), "and original 2D assets remain intact.")
          PY
