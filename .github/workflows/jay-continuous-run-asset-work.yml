name: Jay unified animation asset build

on:
  push:
    branches: [jay-continuous-run-asset-work]
    paths:
      - 'games/semester-survival-runner-3d/assets/*.fbx'
      - 'games/semester-survival-runner-3d/tools/build-jay-unified.py'
      - 'games/semester-survival-runner-3d/tools/inspect-jay-run.py'
      - '.github/workflows/jay-continuous-run-asset-work.yml'

permissions:
  contents: write

jobs:
  build-and-inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Blender and FBX compatibility dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
          BLENDER_PYTHON=$(blender --background --python-expr "import sys; print(sys.executable)" 2>/dev/null | grep "^/" | tail -n 1)
          test -x "$BLENDER_PYTHON"
          curl -fsSL https://bootstrap.pypa.io/get-pip.py -o /tmp/get-pip.py
          "$BLENDER_PYTHON" /tmp/get-pip.py
          "$BLENDER_PYTHON" -m pip install --no-cache-dir numpy
      - name: Build one unified Jay GLB from the original FBX sources
        run: |
          blender --background --python games/semester-survival-runner-3d/tools/build-jay-unified.py
      - name: Verify the exported unified GLB
        run: |
          test -s games/semester-survival-runner-3d/assets/3d/jay/jay-unified.glb
          file games/semester-survival-runner-3d/assets/3d/jay/jay-unified.glb
          ls -lh games/semester-survival-runner-3d/assets/3d/jay/jay-unified.glb
      - name: Inspect the original running animation for root motion and cyclic seams
        run: |
          blender --background --python games/semester-survival-runner-3d/tools/inspect-jay-run.py
      - name: Install Three.js and Chromium browser test dependencies
        run: |
          npm install --prefix games/semester-survival-runner-3d/.ci-test three@0.180.0
          npm install --prefix /tmp/jay-browser playwright@1.56.1
          /tmp/jay-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Serve the isolated GLB fixture
        run: |
          python3 -m http.server 4174 --bind 127.0.0.1 > /tmp/jay-unified-server.log 2>&1 &
          echo $! > /tmp/jay-unified-server.pid
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4174/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/jay-unified-server.log
          exit 1
      - name: Play the in-place run clip for 101 cycles in Chromium
        env:
          PLAYWRIGHT_MODULE: /tmp/jay-browser/node_modules/playwright/index.mjs
        run: |
          node games/semester-survival-runner-3d/tests/jay-unified-smoke.mjs
      - name: Commit the separate unified character asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/semester-survival-runner-3d/assets/3d/jay/jay-unified.glb
          if git diff --cached --quiet; then
            echo "Unified Jay asset unchanged."
          else
            git commit -m "Build separate unified Jay character and animation asset [skip ci]"
            git push origin HEAD:jay-continuous-run-asset-work
          fi
