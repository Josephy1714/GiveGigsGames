    <script>
        (function() {
            'use strict';

            function setText(id, value) {
                const element = document.getElementById(id);
                if (element) element.textContent = value;
            }

            function populate(data) {
                document.title = data.title + ' - 4weird Games';
                setText('TEMPLATE-4weird-game-title', data.title);
                setText('TEMPLATE-4weird-footer-title', data.title);
                setText('TEMPLATE-4weird-how-to-play', data.instructions);

                const bio = document.getElementById('TEMPLATE-4weird-maker-bio');
                if (bio) {
                    bio.textContent = '';
                    const paragraph = document.createElement('p');
                    paragraph.textContent = data.maker.bio;
                    bio.appendChild(paragraph);
                }

                const grid = document.getElementById('TEMPLATE-4weird-credits-grid');
                if (grid && data.credits && data.credits.length > 0) {
                    grid.textContent = '';
                    data.credits.forEach((credit) => {
                        const card = document.createElement('div');
                        card.className = 'TEMPLATE-4weird-credit-card' + (credit.primary ? ' TEMPLATE-4weird-primary' : '');

                        const avatar = document.createElement('div');
                        avatar.className = 'TEMPLATE-4weird-credit-avatar';
                        avatar.textContent = credit.avatar || '👤';

                        const name = document.createElement('h3');
                        name.className = 'TEMPLATE-4weird-credit-name';
                        name.textContent = credit.name;

                        const role = document.createElement('p');
                        role.className = 'TEMPLATE-4weird-credit-role';
                        role.textContent = credit.role;

                        card.append(avatar, name, role);

                        if (credit.url) {
                            const links = document.createElement('p');
                            links.className = 'TEMPLATE-4weird-credit-links';
                            const anchor = document.createElement('a');
                            // Security: game.json URLs are contributor-supplied;
                            // allow http(s) only so javascript: URLs cannot run.
                            try {
                                const parsed = new URL(String(credit.url), window.location.href);
                                if (parsed.protocol !== 'http:' && parsed.protocol !== 'https:') throw new Error('blocked');
                                anchor.href = parsed.href;
                            } catch (e) { anchor.href = '#'; anchor.setAttribute('aria-disabled', 'true'); }
                            anchor.target = '_blank';
                            anchor.rel = 'noopener';
                            anchor.textContent = credit.urlLabel || 'Link';
                            links.appendChild(anchor);
                            card.appendChild(links);
                        }

                        grid.appendChild(card);
                    });
                }
            }

            fetch('game.json')
                .then((response) => response.json())
                .then(populate)
                .catch((error) => console.log('Using Overtake defaults:', error));
        })();
    </script>
