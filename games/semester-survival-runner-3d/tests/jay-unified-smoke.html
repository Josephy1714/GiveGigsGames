<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Jay unified run-loop validation</title>
  <script type="importmap">
    {"imports":{"three":"/games/semester-survival-runner-3d/.ci-test/node_modules/three/build/three.module.js"}}
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "/games/semester-survival-runner-3d/.ci-test/node_modules/three/examples/jsm/loaders/GLTFLoader.js";

const result = { done: false, ok: false, checks: {} };
window.__jayRunTest = result;

try {
  const gltf = await new GLTFLoader().loadAsync(
    "/games/semester-survival-runner-3d/assets/3d/jay/jay-unified.glb"
  );
  const names = gltf.animations.map(clip => clip.name).sort();
  result.checks.clipNames = names;
  const required = ["Fall", "Idle", "Jump", "Run", "Run_InPlace", "Slide"];
  if (JSON.stringify(names) !== JSON.stringify(required)) {
    throw new Error("Unified GLB clip list mismatch: " + names.join(", "));
  }

  const run = gltf.animations.find(clip => clip.name === "Run_InPlace");
  if (!run || run.duration < 0.5 || run.duration > 0.8) {
    throw new Error("Run_InPlace duration is unexpected: " + run?.duration);
  }
  result.checks.runDurationSeconds = run.duration;

  let hips = null;
  let leftFoot = null;
  gltf.scene.traverse(node => {
    if (!node.isBone) return;
    if (node.name === "mixamorig:Hips") hips = node;
    if (node.name === "mixamorig:LeftFoot") leftFoot = node;
  });
  if (!hips || !leftFoot) throw new Error("Required Mixamo Hips/LeftFoot bones were not found.");

  const mixer = new THREE.AnimationMixer(gltf.scene);
  const action = mixer.clipAction(run);
  action.setLoop(THREE.LoopRepeat, Infinity);
  action.clampWhenFinished = false;
  action.play();

  const initialHips = hips.position.clone();
  const initialFoot = leftFoot.quaternion.clone();
  mixer.update(run.duration * 0.5);
  const midHips = hips.position.clone();
  const midFoot = leftFoot.quaternion.clone();
  const hipsMotion = midHips.distanceTo(initialHips);
  const footMotion = 1 - Math.abs(initialFoot.dot(midFoot));
  result.checks.hipsMidCycleMotion = hipsMotion;
  result.checks.footMidCycleQuaternionDelta = footMotion;
  if (hipsMotion < 0.002 && footMotion < 0.002) {
    throw new Error("Run_InPlace appears static; no meaningful skeletal motion was detected.");
  }

  mixer.update(run.duration * 0.5);
  const firstSeamError = hips.position.distanceTo(initialHips);
  result.checks.firstLoopSeamHipsError = firstSeamError;
  if (firstSeamError > 0.003) {
    throw new Error("First run-loop seam moved the hips by " + firstSeamError);
  }

  let maxLoopSeamError = firstSeamError;
  for (let i = 0; i < 100; i++) {
    mixer.update(run.duration);
    const seamError = hips.position.distanceTo(initialHips);
    maxLoopSeamError = Math.max(maxLoopSeamError, seamError);
    if (seamError > 0.003) {
      throw new Error("Hips drift detected after loop " + (i + 2) + ": " + seamError);
    }
  }
  result.checks.loopsSimulated = 101;
  result.checks.maxHipsSeamErrorAcrossLoops = maxLoopSeamError;
  result.checks.actionStillRunning = action.isRunning();
  if (!action.isRunning()) throw new Error("Run_InPlace stopped during repeated playback.");

  result.ok = true;
} catch (error) {
  result.error = String(error?.stack || error);
} finally {
  result.done = true;
}
</script>
</body>
</html>
