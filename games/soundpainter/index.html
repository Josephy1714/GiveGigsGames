    <script>
        // Load game metadata and populate template
        (function() {
            const defaults = {
                "title": "Sound Painter",
                "maker": {
                    "name": "WewennJr",
                    "bio": "Independent contributor creating games for the 4weird platform. I build creative, playable experiences using pure HTML5 and vanilla JavaScript. Sound Painter is my exploration of combining music, color, and interactive art into a browser-based game.",
                    "url": "https://mattyjacks.com",
                    "urlLabel": "4weird Games"
                },
                "credits": [
                    {
                        "name": "WewennJr",
                        "role": "Game Creator",
                        "avatar": "🦖",
                        "primary": true,
                        "url": "https://mattyjacks.com",
                        "urlLabel": "4weird Games"
                    }
                ]
            };

            function populate(data) {
                document.title = data.title + ' - 4weird Games';
                document.getElementById('TEMPLATE-4weird-game-title').textContent = data.title;
                document.getElementById('TEMPLATE-4weird-maker-name').textContent = data.maker.name;
                // Security: bio/credits/links go through FourWeirdMeta
                // (textContent + http(s)-only URLs) so a crafted game.json
                // cannot inject HTML or javascript: links.
                // Metadata helpers are progressive enhancement. Never let a
                // missing helper prevent the actual game from starting.
                window.FourWeirdMeta?.setBio('TEMPLATE-4weird-maker-bio', data.maker && data.maker.bio);
                window.FourWeirdMeta?.setMakerLink('TEMPLATE-4weird-maker-link', data.maker && data.maker.url, data.maker && data.maker.urlLabel);
                window.FourWeirdMeta?.renderCredits('TEMPLATE-4weird-credits-grid', data.credits);
            }

            fetch('game.json')
                .then(r => r.json())
                .then(populate)
                .catch(err => {
                    console.log('Using template defaults:', err);
                    populate(defaults);
                });
        })();
    </script>
