<body class="TEMPLATE-4weird-game-page"><span id="fourweird-hud-shims" hidden><span id="TEMPLATE-4weird-high-score"></span></span>
    <main class="TEMPLATE-4weird-game-main">
        <div class="TEMPLATE-4weird-game-frame">
            <button class="TEMPLATE-4weird-fullscreen-btn" id="TEMPLATE-4weird-fullscreen-btn">📺 Fullscreen</button>
            <canvas id="TEMPLATE-4weird-gameCanvas"></canvas>

                    <h2>Neon Snake</h2>

    <style>
        .more-kouzi-games {
            padding: 60px 20px;
            background: linear-gradient(180deg, rgba(10,10,20,0) 0%, rgba(0,255,255,0.03) 50%, rgba(10,10,20,0) 100%);
        }
        
        .more-kouzi-games .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .section-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 12px;
            background: linear-gradient(90deg, #0ff, #f0f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .section-subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 40px;
            font-size: 1.1rem;
        }
        
        .more-kouzi-games .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .mini-game-card {
            background: rgba(20, 20, 35, 0.8);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 12px;
            padding: 24px 16px;
            text-align: center;
            text-decoration: none;
            color: inherit;
            transition: all 0.3s ease;
        }
        
        .mini-game-card:hover {
            transform: translateY(-5px);
            border-color: rgba(0, 255, 255, 0.5);
            box-shadow: 0 10px 30px rgba(0, 255, 255, 0.15);
        }
        
        .mini-game-card .emoji {
            font-size: 3rem;
            margin-bottom: 12px;
            display: block;
        }
        
        .mini-game-card h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            margin-bottom: 8px;
            color: #fff;
        }
        
        .mini-game-card p {
            font-size: 0.85rem;
            color: #888;
            margin: 0;
            line-height: 1.4;
        }
        
        .view-all-btn {
            text-align: center;
        }
        
        .kouzi-cta {
            padding: 60px 20px;
        }
        
        .kouzi-cta .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .cta-content {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.1) 0%, rgba(0, 255, 255, 0.1) 100%);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
        }
        
        .cta-content h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            margin-bottom: 16px;
            color: #fff;
        }
        
        .cta-content p {
            color: #aaa;
            margin-bottom: 24px;
            line-height: 1.6;
            font-size: 1rem;
        }
        
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 28px;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            font-size: 1rem;
            cursor: pointer;
            border: none;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #06b6d4, #8b5cf6);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(6, 182, 212, 0.3);
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: #0ff;
            border: 1px solid rgba(0, 255, 255, 0.3);
        }
        
        .btn-secondary:hover {
            background: rgba(0, 255, 255, 0.1);
            border-color: rgba(0, 255, 255, 0.5);
        }
        
        @media (max-width: 600px) {
            .section-title {
                font-size: 1.5rem;
            }
            
            .cta-content {
                padding: 30px 20px;
            }
            
            .cta-content h2 {
                font-size: 1.4rem;
            }
            
            .more-kouzi-games .games-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
            
            .mini-game-card {
                padding: 16px 12px;
            }
            
            .mini-game-card .emoji {
                font-size: 2rem;
            }
            
            .mini-game-card h3 {
                font-size: 0.9rem;
            }
            
            .mini-game-card p {
                font-size: 0.75rem;
            }
        }
