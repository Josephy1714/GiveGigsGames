<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#071522"><meta name="description" content="Run through Jay's university journey. Dodge student-life challenges, collect rewards and survive eight semesters."><title>Semester Survival — Jay's University Run</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="runner.css"></head>
<body><main id="runner-shell" aria-label="Semester Survival endless runner"><canvas id="runner-stage" aria-label="Jay running through university districts"></canvas>
<section id="runner-hud" class="is-hidden" aria-live="polite"><div class="hud-stat"><small>SCORE</small><strong id="score">0</strong></div><div class="hud-stat"><small>DISTANCE</small><strong id="distance">0 m</strong></div><div class="hud-stat"><small>CREDITS</small><strong id="coins">0</strong></div><div class="hud-stat semester"><small>PROGRESS</small><strong id="semester">SEM 1/8</strong></div><div class="hud-stat boost" id="boost-status"></div></section>
<button id="pause-run" class="is-hidden" type="button" aria-label="Pause run">Ⅱ</button><div id="runner-toast" role="status" aria-live="polite"></div>
<section id="runner-overlay" aria-modal="true" role="dialog" aria-labelledby="overlay-title"><div class="overlay-panel"><div class="eyebrow">GIVEGIGS ORIGINAL · JAY'S STORY</div><h1 id="overlay-title">SEMESTER SURVIVAL</h1><p id="overlay-copy">Jay's University Run · Swipe to change lanes, jump and slide. Survive all eight semesters.</p><button id="start-run" type="button">START RUN</button><p class="controls-hint">SWIPE ← → CHANGE LANE<br>SWIPE ↑ JUMP · SWIPE ↓ SLIDE</p></div></section></main><script src="runner.js" defer></script></body></html>
