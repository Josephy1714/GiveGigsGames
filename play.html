<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#07111d">
    <title>Play — GiveGigsGames</title>
    <link rel="stylesheet" href="/play.css">
    <script src="/games/catalog-data.js" defer></script>
    <script src="/game-route.js" defer></script>
    <script src="/play.js" defer></script>
  </head>
  <body>
    <header class="player-bar">
      <a class="player-action player-back" href="/ggg/#all-games" aria-label="Back to game select"><span aria-hidden="true">←</span><span class="player-back-label">Games</span></a>
      <div class="player-identity">
        <span id="game-icon" aria-hidden="true"></span>
        <h1 id="game-title">Loading game…</h1>
      </div>
      <div class="player-actions">
        <button class="player-action" id="open-game-info" type="button" aria-label="Game info" aria-haspopup="dialog" hidden>Info</button>
        <button class="player-action" id="fullscreen-game" type="button" aria-label="Enter fullscreen" hidden>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 9V4h5m6 0h5v5m0 6v5h-5m-6 0H4v-5"/></svg>
        </button>
      </div>
    </header>
    <main class="player-content">
      <p id="player-error" role="alert" hidden></p>
      <div id="player-loading" class="player-card" hidden>
        <p id="loading-status" role="status">Loading game…</p>
        <button class="player-action" id="retry-game" type="button" hidden>Retry</button>
      </div>
      <section class="player-card hosted-game" id="hosted-game" aria-labelledby="hosted-title" hidden>
        <span class="hosted-genre" id="hosted-genre"></span>
        <h2 id="hosted-title"></h2>
        <p id="hosted-description"></p>
        <a class="player-action primary-action" id="hosted-link" target="_blank" rel="noopener noreferrer">Launch hosted game ↗</a>
        <p class="player-note">Opens in a new tab.</p>
      </section>
      <iframe id="game-frame" title="Game" allow="fullscreen; autoplay; gamepad" allowfullscreen></iframe>
    </main>
    <dialog id="game-info" aria-labelledby="game-info-title">
      <div class="info-heading">
        <div>
          <p class="hosted-genre" id="info-genre"></p>
          <h2 id="game-info-title"></h2>
        </div>
        <form method="dialog"><button class="player-action" type="submit" aria-label="Close game info" autofocus>✕</button></form>
      </div>
      <p id="info-description"></p>
      <section id="info-controls" aria-labelledby="controls-title" hidden>
        <h3 id="controls-title">Controls</h3>
        <p id="controls-copy"></p>
      </section>
      <nav class="info-actions" aria-label="Game links">
        <a class="player-action" id="play-guide">Guide</a>
        <a class="player-action" id="play-roadmap">Roadmap</a>
        <a class="player-action" id="direct-link">Open directly</a>
      </nav>
    </dialog>
    <p id="fullscreen-status" class="player-toast" role="status" hidden></p>
    <script src="/games/_shared/gamepad-adapter.js" defer></script>
  </body>
</html>
