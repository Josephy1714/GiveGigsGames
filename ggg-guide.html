<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="index,follow">
    <title>Game walkthrough · GiveGigsGames</title>
    <link rel="stylesheet" href="/index.css">
    <link rel="stylesheet" href="/ggg-guide.css">
    <script src="/games/catalog-data.js" defer></script>
    <script src="/game-route.js" defer></script>
    <script src="/ggg-guide.js" defer></script>
  </head>
  <body>
    <header class="topbar"><a class="brand" href="/ggg/">GiveGigsGames</a><nav><a href="/ggg/">Library</a><a id="info-link">Info</a><a id="play-link">Play</a><a id="test-link">Test</a><a id="roadmap-link">Roadmap</a></nav></header>
    <main class="guide-page">
      <p class="eyebrow">WALKTHROUGH</p>
      <h1 id="guide-title">Loading game guide…</h1>
      <p id="guide-description" class="lede"></p>
      <div id="guide-tags" class="game-tags"></div>
      <div id="authored-guide" hidden></div>
      <section id="starter-guide" class="guide-sections" hidden>
        <h2>Get oriented</h2>
        <p id="orient"></p>
        <h2>Learn the systems</h2>
        <p id="systems"></p>
        <h2>Build a strategy</h2>
        <p id="strategy"></p>
        <h2>Use each attempt</h2>
        <p id="practice"></p>
        <h2>When something goes wrong</h2>
        <p id="troubleshooting"></p>
      </section>
      <div class="hero-actions"><a id="play-action" class="button primary">Play game</a><a id="test-action" class="button secondary">Open tester</a><a href="/ggg/" class="button secondary">Back to game select</a></div>
    </main>
    <script src="/games/_shared/gamepad-adapter.js" defer></script>
  </body>
</html>
